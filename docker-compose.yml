# 최전방 리버스 프록시.
#
# 이 서버에서 80/443 을 점유하는 유일한 컨테이너다.
# 도메인을 보고 뒤쪽 앱으로 넘긴다. 앱 컨테이너는 호스트 포트를 열지 않는다.
#
#   docker compose up -d
#   docker compose exec proxy nginx -t     # 설정 검사
#   docker compose exec proxy nginx -s reload
#
# 각 앱은 자기 저장소의 compose 로 따로 배포한다.
# 여기는 그 앞단 라우팅과 TLS 만 담당하므로, 앱을 배포해도 이 스택은 건드리지 않는다.

name: edge

services:
  proxy:
    image: nginx:1.29-alpine
    container_name: edge-proxy
    restart: unless-stopped
    ports:
      # 기본값이 운영 설정이다. 로컬에서 검증할 때만 다른 포트로 덮어쓴다.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      # acme.sh 가 --install-cert 로 갱신할 때마다 이 경로에 복사한다.
      - ${CERT_DIR:-/etc/edge/certs}:/etc/edge/certs:ro
    networks:
      - edge-net
    healthcheck:
      # 라우팅 대상이 없어도 프록시 자체는 살아 있어야 한다.
      #
      # localhost 가 아니라 127.0.0.1 을 쓴다. busybox wget 은 localhost 를
      # ::1(IPv6) 로 먼저 풀 수 있는데, 이 nginx 는 IPv4 로만 듣기 때문에
      # 멀쩡한 프록시가 unhealthy 로 표시된다.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # 앱 저장소들이 같은 이름으로 참여한다.
  # 먼저 만들어 두어야 한다:  docker network create edge-net
  edge-net:
    name: edge-net
    external: true
