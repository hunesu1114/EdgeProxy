# FileHub (파일 저장소)
#
# 원래 filehub-proxy 컨테이너가 하던 일을 그대로 옮겨온 것이다.
# 뒤쪽 filehub-frontend 는 nginx 로, 정적 파일과 /api 프록시를 스스로 한다.

server {
    listen 80;
    server_name filehub-khs.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name filehub-khs.duckdns.org;

    ssl_certificate     /etc/edge/certs/filehub/fullchain.pem;
    ssl_certificate_key /etc/edge/certs/filehub/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # FileHub 는 최대 10GB 업로드를 허용한다. 여기가 더 작으면 앞단에서 먼저 막힌다.
    client_max_body_size 10240m;

    # upstream 을 변수로 둬서 요청 시점에 해석한다.
    # 고정 이름으로 두면 filehub-frontend 가 없을 때 edge 전체가 기동하지 못한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $filehub_upstream filehub-frontend;

    location / {
        proxy_pass http://$filehub_upstream:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대용량 업로드가 중간에 끊기지 않도록 넉넉히 잡는다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
