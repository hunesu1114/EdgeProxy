# CodeReview (커밋 리뷰 · 소스 조회 PWA)
#
# 뒤쪽 codereview-frontend 는 nginx 로, 정적 파일 서빙과 /api 백엔드 프록시를
# 스스로 한다. 여기서는 TLS 종단과 도메인 라우팅만 하고 그대로 넘긴다.

server {
    listen 80;
    server_name codereview-hen.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name codereview-hen.duckdns.org;

    ssl_certificate     /etc/edge/certs/codereview/fullchain.pem;
    ssl_certificate_key /etc/edge/certs/codereview/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # PWA 는 HTTPS 에서만 설치되고 서비스 워커도 동작한다.
    # 공유기가 외부 80 을 점유해 리다이렉트가 밖에서 안 먹는 경우가 있어,
    # 한 번 https 로 들어온 브라우저가 이후 스스로 https 를 쓰게 만든다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 업로드는 없지만 앱 nginx 가 32m 로 잡혀 있다.
    # 여기가 더 작으면 앞단에서 먼저 413 이 나 원인을 찾기 어려워진다.
    client_max_body_size 32m;

    # 도커 내장 DNS. upstream 을 변수로 두면 nginx 가 기동 시점이 아니라
    # 요청 시점에 이름을 해석한다.
    #
    # 이게 없으면 codereview-frontend 가 내려간 상태에서 edge 가 아예 기동하지
    # 못하고, 그 순간 같은 프록시를 쓰는 filehub·boram 까지 전부 죽는다.
    # valid 를 짧게 둬서 재배포로 컨테이너 IP 가 바뀌어도 곧 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $codereview_upstream codereview-frontend;

    location / {
        proxy_pass http://$codereview_upstream:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 뒤쪽이 원래 요청이 https 였음을 알아야 OAuth 콜백 URL 을
        # http 로 만들지 않는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # 큰 저장소의 트리·diff 는 GitHub 왕복이 끼어 느릴 수 있다.
        # 앱 nginx 도 120s 라 여기를 더 짧게 두면 앞단에서 먼저 끊긴다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
