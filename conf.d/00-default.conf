# 도메인이 맞지 않는 요청을 받아내는 기본 서버.
#
# 이게 없으면 알파벳 순으로 첫 번째 server 블록이 기본이 되어,
# 엉뚱한 도메인이나 IP 직접 접속이 특정 앱으로 흘러들어간다.

server {
    listen 80 default_server;
    server_name _;

    # edge 자체 헬스체크. 뒤쪽 앱 상태와 무관하게 프록시 생존만 확인한다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # acme.sh 의 HTTP-01 챌린지 경로.
    # DNS-01 을 쓰면 필요 없지만, 방식을 바꿀 때를 대비해 열어 둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;  # 응답 없이 연결을 끊는다
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # 기본 서버에도 인증서가 있어야 TLS 핸드셰이크가 성립한다.
    # 아무 도메인 인증서나 하나 쓰면 된다. 어차피 이 블록은 거부만 한다.
    ssl_certificate     /etc/edge/certs/default/fullchain.pem;
    ssl_certificate_key /etc/edge/certs/default/privkey.pem;

    return 444;
}
