# Secret Manager
#
# 이 파일은 edge 저장소의 conf.d/ 에 두는 것이다. 이 저장소에서는 배포되지 않는다.
#   cp deploy/edge/secret-manager.conf ~/edge/conf.d/secret-manager.conf
# 그리고 edge 저장소에 커밋해서 push 하면 edge 의 CI 가 반영한다.
#
# 뒤쪽 secret-manager-web 은 nginx 로, 정적 파일 서빙과 /api 백엔드 프록시를 스스로 한다.
# 여기서는 TLS 종단과 도메인 라우팅만 하고 그대로 넘긴다.

server {
    listen 80;
    server_name secret-manager.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name secret-manager.duckdns.org;

    ssl_certificate     /etc/edge/certs/secret-manager/fullchain.pem;
    ssl_certificate_key /etc/edge/certs/secret-manager/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 이 사이트는 평문 Secret 이 오간다. 한 번이라도 http 로 나가면 안 된다.
    # includeSubDomains 는 넣지 않는다. duckdns.org 하위 다른 사이트까지 걸린다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 프레임에 태워 클릭재킹으로 Reveal 을 유도하는 것을 막는다.
    # 뒤쪽 앱 nginx 도 같은 헤더를 붙이지만, 앞단에서도 보장한다.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    # Secret 값은 최대 32KB 다. CI fetch 도 경로 목록만 보낸다.
    # 크게 열어 둘 이유가 없다.
    client_max_body_size 1m;

    # 도커 내장 DNS. upstream 을 변수로 두면 nginx 가 기동 시점이 아니라
    # 요청 시점에 이름을 해석한다.
    #
    # 이게 없으면 secret-manager-web 이 내려간 상태에서 edge 가 아예 기동하지 못하고,
    # 그 순간 같은 프록시를 쓰는 다른 서비스까지 전부 죽는다.
    # valid 를 짧게 둬서 재배포로 컨테이너 IP 가 바뀌어도 곧 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $secret_manager_upstream secret-manager-web;

    location / {
        proxy_pass http://$secret_manager_upstream:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 뒤쪽이 원래 요청이 https 였음을 알아야 리다이렉트를 http 로 만들지 않는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
